name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow qrcode numpy pyinstaller

    - name: Build app with PyInstaller
      run: |
        pyinstaller --onefile --windowed QR-code_mama.py

    - name: Upload built app
      uses: actions/upload-artifact@v3
      with:
        name: macos-app
        path: dist/QR-code_mama.app
